<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ОГЭ · 9 класс · Задание 9 — Тренажёр</title>
<style>
:root{
  --blue:#15335C; --blue2:#1F4E8C; --pink:#C4407B; --green:#2E8B57;
  --red:#C0392B; --yellow:#F1C40F; --bg:#F4F6FA; --card:#FFFFFF; --line:#DDE3EE;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Segoe UI', Arial, sans-serif; background:var(--bg); color:var(--blue); line-height:1.5;}
.wrap{max-width:760px; margin:0 auto; padding:16px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px; margin-top:16px; box-shadow:0 2px 8px rgba(21,51,92,.06);}
h1{font-size:26px; margin-bottom:6px;}
h2{font-size:20px; margin-bottom:10px;}
.sub{color:#5A6B8C; font-size:15px;}
.eq{font-size:22px; font-family:'Cambria Math', Georgia, serif; font-weight:600; text-align:center; margin:14px 0; letter-spacing:.5px;}
.btn{display:inline-block; border:none; border-radius:10px; padding:12px 20px; font-size:16px; font-weight:600; cursor:pointer; margin:6px 8px 6px 0; transition:.15s;}
.btn:active{transform:scale(.97);}
.btn-blue{background:var(--blue); color:#fff;}
.btn-blue:hover{background:var(--blue2);}
.btn-pink{background:var(--pink); color:#fff;}
.btn-ghost{background:#fff; color:var(--blue); border:1.5px solid var(--line);}
.btn-ghost:hover{border-color:var(--blue);}
.btn-small{padding:7px 14px; font-size:14px;}
.level-btn{width:100%; text-align:left; margin:8px 0; padding:16px 18px;}
.level-btn .lvl-name{font-size:18px;}
.level-btn .lvl-desc{font-size:14px; font-weight:400; opacity:.85; margin-top:3px;}
.progress-bar{height:10px; background:#E4E9F2; border-radius:6px; overflow:hidden; margin:10px 0 4px;}
.progress-fill{height:100%; background:var(--blue); width:0%; transition:width .3s;}
.statline{display:flex; justify-content:space-between; font-size:14px; color:#5A6B8C; margin-top:6px;}
.answer-row{display:flex; gap:10px; margin-top:14px;}
.answer-row input{flex:1; font-size:20px; padding:10px 14px; border:2px solid var(--line); border-radius:10px; color:var(--blue); outline:none;}
.answer-row input:focus{border-color:var(--blue);}
.answer-row input.ok{border-color:var(--green); background:#EAF7EF;}
.answer-row input.err{border-color:var(--red); background:#FBEDEB;}
.hint-box{background:#FFF8E1; border:1px solid #F0DF9A; border-radius:10px; padding:12px 16px; margin-top:12px; font-size:15px;}
.sol-box{background:#EAF7EF; border:1px solid #BFE3CD; border-radius:10px; padding:12px 16px; margin-top:12px; font-size:15px; white-space:pre-line;}
.warn-box{background:#FBEDEB; border:1px solid #F0B9B2; border-radius:10px; padding:12px 16px; margin-top:12px; font-size:15px;}
.video-btn{display:block; width:100%; text-align:center; background:var(--pink); color:#fff; border:none; border-radius:10px; padding:14px; font-size:17px; font-weight:600; cursor:pointer; margin-top:14px;}
.video-btn:hover{filter:brightness(1.08);}
.topbar{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
.badge{background:#EAF0F9; color:var(--blue); border-radius:8px; padding:6px 12px; font-size:14px; font-weight:600;}
.big-emoji{font-size:44px; text-align:center; margin:8px 0;}
.center{text-align:center;}
.hidden{display:none;}
.fade-in{animation:fade .35s ease;}
@keyframes fade{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
details{margin-top:10px;}
summary{cursor:pointer; font-weight:600; color:var(--blue2); font-size:15px;}
</style>
</head>
<body>
<div class="wrap">

<!-- ================= ТИТУЛЬНИК ================= -->
<div id="screen-title" class="card fade-in">
  <h1>ОГЭ · 9 класс · Задание 9</h1>
  <p class="sub">Уравнения: линейные, квадратные, дробно-рациональные. Три уровня — от базы до экзамена. Подсказки по шагам, разбор после каждого задания.</p>
  <button class="video-btn" onclick="openVideo()">📹 Видео-разбор (методичка)</button>
  <h2 style="margin-top:22px;">Выберите уровень</h2>
  <button class="btn btn-blue level-btn" onclick="startLevel(0)">
    <div class="lvl-name">🟢 База — линейные уравнения</div>
    <div class="lvl-desc">Скобки, перенос, подобные слагаемые. То, что нужно довести до автомата.</div>
  </button>
  <button class="btn btn-blue level-btn" onclick="startLevel(1)">
    <div class="lvl-name">🟡 Средний — скобки, дроби, x²</div>
    <div class="lvl-desc">Смешанные уравнения и первые квадратные. Внимание к знакам.</div>
  </button>
  <button class="btn btn-pink level-btn" onclick="startLevel(2)">
    <div class="lvl-name">🔴 Продвинутый — как на ОГЭ</div>
    <div class="lvl-desc">Дискриминант, дробно-рациональные уравнения, ловушки с ОДЗ.</div>
  </button>
</div>

<!-- ================= ЭКРАН ЗАДАНИЙ ================= -->
<div id="screen-quiz" class="hidden">
  <div class="card fade-in">
    <div class="topbar">
      <span class="badge" id="q-level"></span>
      <span class="badge" id="q-count"></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    <div class="statline"><span id="stat-ok">✔ 0</span><span id="stat-miss">✘ 0</span></div>
    <div class="eq" id="q-eq"></div>
    <p class="sub" id="q-text"></p>
    <div class="answer-row">
      <input id="answer" type="text" inputmode="text" placeholder="Ответ, например: 7 или -2,5" autocomplete="off">
      <button class="btn btn-blue" onclick="checkAnswer()">Проверить</button>
    </div>
    <div id="feedback"></div>
    <details id="hint-wrap"><summary>💡 Подсказка по шагам</summary><div class="hint-box" id="hint-box"></div></details>
    <div style="margin-top:14px;">
      <button class="btn btn-ghost btn-small" onclick="quitToTitle()">← На главную</button>
      <button class="btn btn-ghost btn-small" id="btn-skip" onclick="nextTask(true)">Пропустить</button>
      <button class="btn btn-blue btn-small hidden" id="btn-next" onclick="nextTask(false)">Следующее →</button>
    </div>
  </div>
</div>

<!-- ================= ФИНАЛ ================= -->
<div id="screen-final" class="hidden">
  <div class="card fade-in center">
    <div class="big-emoji" id="fin-emoji"></div>
    <h2 id="fin-title"></h2>
    <p class="sub" id="fin-text"></p>
    <div style="margin-top:16px;">
      <button class="btn btn-blue" onclick="showTitle()">На главную</button>
      <button class="btn btn-ghost" onclick="startLevel(currentLevel)">Пройти ещё раз</button>
    </div>
  </div>
</div>

</div>

<script>
// ======== ССЫЛКА НА ВИДЕО-РАЗБОР (вставить сюда) ========
const VIDEO_URL = ""; // ← сюда вставить ссылку на VK Видео

function openVideo(){
  if(VIDEO_URL.trim() === ""){
    alert("Ссылка на видео будет добавлена в следующей версии тренажёра.");
  } else {
    window.open(VIDEO_URL, "_blank");
  }
}

// ======== БАНК ЗАДАНИЙ ========
const LEVELS = [
{
  name:"База · линейные",
  tasks:[
    {eq:"4x + 7 = 19", ans:"3",
     hints:["Перенесите 7 вправо со сменой знака: 4x = 19 − 7.","Посчитайте правую часть и разделите обе части на 4."],
     sol:"4x = 19 − 7\n4x = 12\nx = 12 : 4\nx = 3"},
    {eq:"2x − 5 = 9", ans:"7",
     hints:["Перенесите −5 вправо: знак меняется на плюс.","Разделите обе части на 2."],
     sol:"2x = 9 + 5\n2x = 14\nx = 7"},
    {eq:"3x + 5 = x + 17", ans:"6",
     hints:["Иксы — влево, числа — вправо. При переносе знак меняется.","3x − x = 2x. Приведите подобные с обеих сторон."],
     sol:"3x − x = 17 − 5\n2x = 12\nx = 6"},
    {eq:"5(x − 2) = 15", ans:"5",
     hints:["Раскройте скобки: 5·x и 5·(−2).","Либо разделите обе части уравнения на 5 — так быстрее."],
     sol:"x − 2 = 15 : 5\nx − 2 = 3\nx = 5"},
    {eq:"7x − 3 = 4x + 12", ans:"5",
     hints:["7x − 4x = 3x, а 12 + 3 = 15.","Получится 3x = 15."],
     sol:"7x − 4x = 12 + 3\n3x = 15\nx = 5"},
    {eq:"−2x + 9 = 3", ans:"3",
     hints:["Перенесите 9 вправо: −2x = 3 − 9.","Разделите на −2. Минус никуда не теряется!"],
     sol:"−2x = 3 − 9\n−2x = −6\nx = −6 : (−2)\nx = 3"},
    {eq:"6x = x + 25", ans:"5",
     hints:["Перенесите x влево: 6x − x = 5x.","Разделите 25 на 5."],
     sol:"6x − x = 25\n5x = 25\nx = 5"},
    {eq:"2(3x − 4) = 4x + 6", ans:"7",
     hints:["Раскройте скобки: 6x − 8 = 4x + 6.","Иксы влево, числа вправо: 6x − 4x = 6 + 8."],
     sol:"6x − 8 = 4x + 6\n6x − 4x = 6 + 8\n2x = 14\nx = 7"},
    {eq:"0,5x + 4 = 9", ans:"10",
     hints:["Перенесите 4 вправо: 0,5x = 5.","Разделите на 0,5 — это то же самое, что умножить на 2."],
     sol:"0,5x = 9 − 4\n0,5x = 5\nx = 5 : 0,5\nx = 10"},
    {eq:"3x + 12 = 0", ans:"-4",
     hints:["Перенесите 12 вправо.","Корень получится отрицательным — это нормально!"],
     sol:"3x = −12\nx = −12 : 3\nx = −4"}
  ]
},
{
  name:"Средний · скобки, дроби, x²",
  tasks:[
    {eq:"3(x − 2) − (4 − x) = 2(x + 1)", ans:"6",
     hints:["Минус перед скобкой меняет ВСЕ знаки внутри: −(4 − x) = −4 + x.","Раскройте скобки и приведите подобные слева и справа.","Перенесите иксы влево, числа вправо и разделите на 2."],
     sol:"3x − 6 − 4 + x = 2x + 2\n4x − 10 = 2x + 2\n4x − 2x = 2 + 10\n2x = 12\nx = 6"},
    {eq:"5(x + 1) − 2(x − 3) = 26", ans:"5",
     hints:["Раскройте скобки: 5x + 5 − 2x + 6 = 26.","Приведите подобные: 3x + 11 = 26.","Перенесите 11 вправо и разделите на 3."],
     sol:"5x + 5 − 2x + 6 = 26\n3x + 11 = 26\n3x = 26 − 11\n3x = 15\nx = 5"},
    {eq:"(2x + 1) : 3 = 5", ans:"7",
     hints:["Умножьте ОБЕ части уравнения на 3 — дробь исчезнет.","Получится 2x + 1 = 15."],
     sol:"2x + 1 = 5 · 3\n2x + 1 = 15\n2x = 14\nx = 7"},
    {eq:"(2x − 1) : 5 = x : 5 + 2", ans:"11",
     hints:["Умножьте обе части на 5.","Справа: 5·(x:5) = x, и 5·2 = 10."],
     sol:"2x − 1 = x + 10\n2x − x = 10 + 1\nx = 11"},
    {eq:"x² = 49. Укажите больший корень", ans:"7",
     hints:["Какое число в квадрате даёт 49? Их два.","Больший из корней — без минуса."],
     sol:"x² = 49\nx = 7 или x = −7\nБольший корень: x = 7"},
    {eq:"x² − 5x + 6 = 0. Укажите больший корень", ans:"3",
     hints:["Подберите два числа, произведение которых равно 6, а сумма равна 5.","Это 2 и 3. Больший корень — 3."],
     sol:"x² − 5x + 6 = 0\nx₁ · x₂ = 6, x₁ + x₂ = 5\nx₁ = 2, x₂ = 3\nБольший корень: x = 3"},
    {eq:"2x² − 8 = 0. Укажите больший корень", ans:"2",
     hints:["Сначала перенесите −8 вправо: 2x² = 8.","Разделите на 2, затем извлеките корень."],
     sol:"2x² = 8\nx² = 4\nx = 2 или x = −2\nБольший корень: x = 2"},
    {eq:"4x − (x − 3) = 2x + 5", ans:"2",
     hints:["Минус перед скобкой: 4x − x + 3.","Приведите подобные: 3x + 3 = 2x + 5."],
     sol:"4x − x + 3 = 2x + 5\n3x + 3 = 2x + 5\n3x − 2x = 5 − 3\nx = 2"},
    {eq:"(3x + 2) : 2 − x = 4", ans:"6",
     hints:["Умножьте всё уравнение на 2.","Слева: 3x + 2 − 2x."],
     sol:"3x + 2 − 2x = 8\nx + 2 = 8\nx = 6"},
    {eq:"x² + 2x − 15 = 0. Укажите меньший корень", ans:"-5",
     hints:["Подберите два числа: произведение −15, сумма −2.","Это −5 и 3. Меньший корень — −5."],
     sol:"x² + 2x − 15 = 0\nx₁ · x₂ = −15, x₁ + x₂ = −2\nx₁ = −5, x₂ = 3\nМеньший корень: x = −5"}
  ]
},
{
  name:"Продвинутый · как на ОГЭ",
  tasks:[
    {eq:"x² − 7x + 10 = 0. Укажите меньший корень", ans:"2",
     hints:["Дискриминант: D = 49 − 40 = 9.","√D = 3, корни (7 ± 3) : 2."],
     sol:"D = 49 − 40 = 9, √D = 3\nx = (7 + 3):2 = 5\nx = (7 − 3):2 = 2\nМеньший корень: x = 2"},
    {eq:"3x² + 5x − 2 = 0. Укажите больший корень", ans:"0.333",
     hints:["D = 25 + 4·3·2 = 49.","Корни: (−5 + 7) : 6 и (−5 − 7) : 6.","Больший корень равен 1/3 — запишите как 0,333 или 1/3."],
     sol:"D = 25 + 24 = 49, √D = 7\nx = (−5 + 7):6 = 2:6 = 1/3\nx = (−5 − 7):6 = −2\nБольший корень: x = 1/3 ≈ 0,333"},
    {eq:"2x² + 3x − 5 = 0. Укажите меньший корень", ans:"-2.5",
     hints:["D = 9 + 40 = 49.","Корни: (−3 ± 7) : 4."],
     sol:"D = 9 + 40 = 49, √D = 7\nx = (−3 + 7):4 = 1\nx = (−3 − 7):4 = −2,5\nМеньший корень: x = −2,5"},
    {eq:"(x − 3) : (x − 5) = 0", ans:"3",
     hints:["Дробь равна нулю, когда числитель равен нулю.","Но знаменатель не должен быть нулём: x ≠ 5.","Числитель: x − 3 = 0."],
     sol:"x − 3 = 0 → x = 3\nПроверка ОДЗ: x ≠ 5 — корень 3 подходит.\nОтвет: 3"},
    {eq:"5 : (x − 2) = 10 : (x + 3)", ans:"7",
     hints:["По свойству пропорции: 5(x + 3) = 10(x − 2).","Раскройте скобки и решите линейное уравнение.","Не забудьте ОДЗ: x ≠ 2, x ≠ −3."],
     sol:"5(x + 3) = 10(x − 2)\n5x + 15 = 10x − 20\n15 + 20 = 10x − 5x\n35 = 5x\nx = 7 (ОДЗ соблюдено)"},
    {eq:"(x − 4) : (x + 4) = 0", ans:"4",
     hints:["Числитель равен нулю.","Знаменатель x + 4 ≠ 0, то есть x ≠ −4 — это НЕ ответ."],
     sol:"x − 4 = 0 → x = 4\nОДЗ: x ≠ −4\nОтвет: 4"},
    {eq:"(x² − 9) : (x − 3) = 0. Укажите единственный корень", ans:"-3",
     hints:["Разложите числитель: x² − 9 = (x − 3)(x + 3).","Дробь равна нулю, когда числитель равен нулю — НО знаменатель не ноль.","x = 3 обращает знаменатель в ноль — его вычёркиваем!"],
     sol:"(x − 3)(x + 3) = 0 → x = 3 или x = −3\nОДЗ: x ≠ 3\nЗначит, остаётся только x = −3\nОтвет: −3"},
    {eq:"x² − 12x + 32 = 0. Укажите больший корень", ans:"8",
     hints:["D = 144 − 4·32 = 16.","√D = 4, корни (12 ± 4) : 2."],
     sol:"D = 144 − 128 = 16, √D = 4\nx = (12 + 4):2 = 8\nx = (12 − 4):2 = 4\nБольший корень: x = 8"},
    {eq:"−x² + 6x + 7 = 0. Укажите больший корень", ans:"7",
     hints:["Умножьте всё уравнение на −1: x² − 6x − 7 = 0.","Подберите корни: произведение −7, сумма 6."],
     sol:"x² − 6x − 7 = 0\nx₁ · x₂ = −7, x₁ + x₂ = 6\nx₁ = 7, x₂ = −1\nБольший корень: x = 7"},
    {eq:"(x + 2) : (x − 1) = (2x + 1) : (x + 3). Укажите больший корень", ans:"7",
     hints:["По свойству пропорции: (x+2)(x+3) = (2x+1)(x−1).","Раскройте скобки и соберите всё в одну сторону — получится квадратное уравнение.","x² − 6x − 7 = 0 → корни 7 и −1. Оба в ОДЗ."],
     sol:"(x+2)(x+3) = (2x+1)(x−1)\nx² + 5x + 6 = 2x² − x − 1\n0 = x² − 6x − 7\nD = 36 + 28 = 64, √D = 8\nx = (6+8):2 = 7, x = (6−8):2 = −1\nОДЗ: x ≠ 1, x ≠ −3 — оба корня подходят.\nБольший корень: x = 7"}
  ]
}];

// ======== СОСТОЯНИЕ ========
let currentLevel = 0, order = [], idx = 0, okCount = 0, missCount = 0, solved = false;

const $ = id => document.getElementById(id);

function showTitle(){
  $("screen-quiz").classList.add("hidden");
  $("screen-final").classList.add("hidden");
  $("screen-title").classList.remove("hidden");
  window.scrollTo(0,0);
}
function quitToTitle(){ showTitle(); }

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startLevel(l){
  currentLevel = l;
  order = shuffle(LEVELS[l].tasks);
  idx = 0; okCount = 0; missCount = 0;
  $("screen-title").classList.add("hidden");
  $("screen-final").classList.add("hidden");
  $("screen-quiz").classList.remove("hidden");
  renderTask();
  window.scrollTo(0,0);
}

function renderTask(){
  solved = false;
  const t = order[idx];
  $("q-level").textContent = LEVELS[currentLevel].name;
  $("q-count").textContent = "Задание " + (idx + 1) + " из " + order.length;
  $("progress").style.width = (idx / order.length * 100) + "%";
  $("stat-ok").textContent = "✔ " + okCount;
  $("stat-miss").textContent = "✘ " + missCount;
  $("q-eq").textContent = t.eq;
  $("q-text").textContent = t.q || "Решите уравнение. В ответе укажите корень (корни).";
  $("answer").value = "";
  $("answer").className = "";
  $("answer").disabled = false;
  $("feedback").innerHTML = "";
  $("hint-box").innerHTML = "<ol>" + t.hints.map(h => "<li>" + h + "</li>").join("") + "</ol>";
  $("hint-wrap").open = false;
  $("btn-next").classList.add("hidden");
  $("btn-skip").classList.remove("hidden");
  $("answer").focus();
}

function parseNum(s){
  s = s.trim().replace(/,/g, ".").replace(/\s/g, "");
  if(s.includes("/")){
    const p = s.split("/");
    if(p.length === 2 && p[0] !== "" && p[1] !== ""){
      const a = parseFloat(p[0]), b = parseFloat(p[1]);
      if(!isNaN(a) && !isNaN(b) && b !== 0) return a / b;
    }
    return NaN;
  }
  const v = parseFloat(s);
  return isNaN(v) ? NaN : v;
}

function checkAnswer(){
  if(solved) return;
  const t = order[idx];
  const user = parseNum($("answer").value);
  const right = parseNum(t.ans);
  const fb = $("feedback");
  if(isNaN(user)){
    fb.innerHTML = '<div class="warn-box">Введите число — например, 7 или −2,5 (можно 1/3).</div>';
    return;
  }
  if(Math.abs(user - right) < 0.001){
    solved = true;
    okCount++;
    $("answer").className = "ok";
    $("answer").disabled = true;
    fb.innerHTML = '<div class="sol-box"><b>✔ Верно!</b>\n' + esc(t.sol) + '</div>';
    $("hint-wrap").open = false;
    $("btn-next").classList.remove("hidden");
    $("btn-skip").classList.add("hidden");
    $("stat-ok").textContent = "✔ " + okCount;
  } else {
    missCount++;
    $("answer").className = "err";
    $("stat-miss").textContent = "✘ " + missCount;
    fb.innerHTML = '<div class="warn-box">✘ Пока не сходится. Откройте подсказку по шагам и попробуйте ещё раз — ошибки здесь самые обычные.</div>';
  }
}

function nextTask(skipped){
  if(skipped && !solved) missCount++;
  idx++;
  if(idx >= order.length){ finish(); return; }
  renderTask();
}

function finish(){
  const total = order.length;
  const pct = Math.round(okCount / total * 100);
  $("screen-quiz").classList.add("hidden");
  $("screen-final").classList.remove("hidden");
  let e, t, s;
  if(pct >= 90){ e = "🏆"; t = "Блестяще! " + okCount + " из " + total; s = "Такой уровень — это 4–5 на реальном ОГЭ. Можно смело держаться продвинутого темпа."; }
  else if(pct >= 70){ e = "💪"; t = "Хорошо! " + okCount + " из " + total; s = "Основа крепкая. Перечитайте разборы задач с ошибками — и результат подрастёт."; }
  else { e = "📚"; t = okCount + " из " + total; s = "Начало положено. Вернитесь к уровню пониже или посмотрите видео-разбор — алгоритм закрепится."; }
  $("fin-emoji").textContent = e;
  $("fin-title").textContent = t;
  $("fin-text").textContent = s + " (" + pct + "% верных ответов)";
  window.scrollTo(0,0);
}

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

$("answer").addEventListener("keydown", function(ev){
  if(ev.key === "Enter") checkAnswer();
});
</script>
